name: Submission Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate-submission:
    name: Validate Submission
    runs-on: ubuntu-latest

    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show submission information
        run: |
          echo "==============================================="
          echo " COMPUTER ARCHITECTURE - SUBMISSION VALIDATION"
          echo "==============================================="
          echo "Repository : ${{ github.repository }}"
          echo "Author     : ${{ github.actor }}"
          echo "Branch     : $HEAD_REF"
          echo "Target     : $BASE_REF"
          echo "PR         : #$PR_NUMBER"

      - name: Validate branch name and detect group
        id: submission
        shell: bash
        run: |
          echo "Checking branch name..."

          if [[ ! "$HEAD_REF" =~ ^team-([0-9]{2})/entrega-([0-9]{2})$ ]]; then
            echo "ERROR: Invalid branch name."
            echo "Expected: team-XX/entrega-NN"
            echo "Example : team-03/entrega-02"
            exit 1
          fi

          TEAM_NUMBER="${BASH_REMATCH[1]}"
          DELIVERY_NUMBER="${BASH_REMATCH[2]}"
          GROUP_DIR="groups/group-${TEAM_NUMBER}"

          echo "team_number=$TEAM_NUMBER" >> "$GITHUB_OUTPUT"
          echo "delivery_number=$DELIVERY_NUMBER" >> "$GITHUB_OUTPUT"
          echo "group_dir=$GROUP_DIR" >> "$GITHUB_OUTPUT"

          echo "OK: Team $TEAM_NUMBER / Delivery $DELIVERY_NUMBER"
          echo "Allowed directory: $GROUP_DIR/"

      - name: Detect changed files
        run: |
          echo "Files changed in this Pull Request:"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" | tee changed-files-status.txt
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee changed-files.txt
          echo ""
          echo "Total paths changed: $(wc -l < changed-files.txt)"

      - name: Check submission contains changes
        run: |
          if [ ! -s changed-files.txt ]; then
            echo "ERROR: No files were changed in this Pull Request."
            exit 1
          fi
          echo "OK: Pull Request contains changes."

      - name: Validate all changed paths belong to the group
        env:
          GROUP_DIR: ${{ steps.submission.outputs.group_dir }}
        run: |
          echo "Checking changed paths..."
          echo "Allowed path: $GROUP_DIR/"
          echo ""

          INVALID=false

          while IFS= read -r file; do
            if [[ "$file" == "$GROUP_DIR/"* ]]; then
              echo "OK: $file"
            else
              echo "ERROR: Change outside the group's directory: $file"
              INVALID=true
            fi
          done < changed-files.txt

          if [ "$INVALID" = true ]; then
            echo ""
            echo "Students may add, modify, rename or delete files only inside:"
            echo "  $GROUP_DIR/"
            exit 1
          fi

          echo ""
          echo "OK: All changed paths belong to the group."

      - name: Show change types
        run: |
          echo "Change types detected:"
          echo "A = added | M = modified | D = deleted | R = renamed"
          echo ""
          cat changed-files-status.txt
          echo ""
          echo "Multiple files and additions/deletions are allowed inside the group's directory."

      - name: Validate Issue reference
        shell: bash
        run: |
          echo "Checking Issue reference in Pull Request description..."
          shopt -s nocasematch

          if [[ "$PR_BODY" =~ (Related[[:space:]]+to|Refs)[[:space:]]+\\#[0-9]+ ]]; then
            echo "OK: Pull Request is linked to an Issue."
          else
            echo "ERROR: Pull Request is not linked to the activity Issue."
            echo "Add one of these lines to the PR description:"
            echo "  Related to #NUMBER"
            echo "or"
            echo "  Refs #NUMBER"
            exit 1
          fi

      - name: Submission approved
        env:
          TEAM_NUMBER: ${{ steps.submission.outputs.team_number }}
          DELIVERY_NUMBER: ${{ steps.submission.outputs.delivery_number }}
          GROUP_DIR: ${{ steps.submission.outputs.group_dir }}
        run: |
          echo ""
          echo "==============================================="
          echo "          SUBMISSION VALIDATION PASSED"
          echo "==============================================="
          echo "Group    : $TEAM_NUMBER"
          echo "Delivery : $DELIVERY_NUMBER"
          echo "Directory: $GROUP_DIR/"
          echo ""
          echo "[OK] Branch name"
          echo "[OK] One or more changed files"
          echo "[OK] Changes restricted to the group's directory"
          echo "[OK] Added/modified/renamed/deleted files allowed"
          echo "[OK] Issue reference"
          echo ""
          echo "The Pull Request is ready for professor review."
